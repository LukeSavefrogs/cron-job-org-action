name: "cron-job.org folder sync"
description: "Create, update and delete the cron jobs of a cron-job.org folder, e.g. for each preview environment"
author: "LukeSavefrogs"
branding:
  icon: clock
  color: blue

inputs:
  api-key:
    description: "API key of cron-job.org (Console → Settings → API): pass it from a secret."
    required: true
  command:
    description: >-
      `apply`: create the folder if needed, create or update its jobs (identified by their title) and, with `prune`,
      delete the other jobs of the folder. `delete`: delete the folders (one per line, `*` as wildcard) and their jobs.
      `list`: list the folders of the account in the `folders` output.
    required: false
    default: "apply"
  folder:
    description: >-
      Title of the folder (`apply`), or titles of the folders, one per line, where `*` matches any characters
      (`delete`). At most 128 characters.
    required: false
    default: ""
  jobs:
    description: >-
      `apply` only: YAML (or JSON) list of the jobs of the folder. Each job needs a `title`, a `url` and a `schedule`
      (a crontab expression, quoted, e.g. "*/5 8-22 * * 1-5"), unless given by the inputs below; see the README.
    required: false
    default: ""
  base-url:
    description: "`apply` only: URL prepended to the relative `url` of the jobs (e.g. `/cron/run`)."
    required: false
    default: ""
  schedule:
    description: "`apply` only: crontab expression of the jobs that do not set their own `schedule`."
    required: false
    default: ""
  method:
    description: "`apply` only: HTTP method of the jobs that do not set their own `method` (default: GET)."
    required: false
    default: ""
  headers:
    description: >-
      `apply` only: request headers of every job, one `Name: value` per line. The value is the rest of the line, as is
      (no quoting needed, e.g. for a secret). A job's own `headers` replace the ones with the same name.
    required: false
    default: ""
  timezone:
    description: "`apply` only: time zone of the schedules of the jobs that do not set their own (e.g. `Europe/Rome`)."
    required: false
    default: "UTC"
  prune:
    description: "`apply` only: delete the jobs of the folder that are not listed in `jobs`."
    required: false
    default: "true"
  exclude:
    description: "`delete` only: titles of the folders to keep, one per line, where `*` matches any characters."
    required: false
    default: ""
  dry-run:
    description: "`apply` and `delete`: only read, and report what would change (log, step summary and outputs)."
    required: false
    default: "false"
  api-url:
    description: "Endpoint of the API (e.g. of a self-hosted cron-job.org)."
    required: false
    default: "https://api.cron-job.org"

outputs:
  folder-id:
    description: "`apply`: identifier of the folder (empty when it would be created, with `dry-run`)."
  job-ids:
    description: '`apply`: JSON object mapping the title of each job to its identifier (e.g. `{"Ping": 12345}`).'
  created:
    description: "`apply`: JSON array of the titles of the jobs created (or that would be, with `dry-run`)."
  updated:
    description: "`apply`: JSON array of the titles of the jobs updated (or that would be, with `dry-run`)."
  deleted:
    description: "`apply`: JSON array of the titles of the jobs deleted by `prune` (or that would be, with `dry-run`)."
  folders:
    description: >-
      `delete`: JSON array of the deleted folders (or that would be, with `dry-run`); `list`: JSON array of every
      folder of the account. Each folder is an object with its `folderId` and `title`.

runs:
  using: "node24"
  main: "dist/index.js"
