name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The runtime of the action (node24), and the oldest supported versions
        node-version: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

  # GitHub runs the committed bundle: it must match the sources
  dist:
    name: dist/ is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compare with the committed bundle
        run: |
          if [[ -n "$(git status --porcelain -- dist/)" ]]; then
            git status --short -- dist/
            echo "::error::dist/ does not match the sources: run \`npm run build\` and commit dist/."
            exit 1
          fi
